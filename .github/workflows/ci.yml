name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format check (ruff, Black/Pyink style)
        run: uv run ruff format --check .

      # Docstrings (D1/D205) and long comment lines (E501) are still being
      # fixed; every other Google-style rule is enforced.
      - name: Lint (ruff)
        run: uv run ruff check --ignore D1,D205,E501 .

      - name: Tests with coverage
        run: |
          uv run --with coverage==7.6.4 coverage run -m unittest discover -s broker/tests
          uv run --with coverage==7.6.4 --with pytest coverage run -m pytest -q -p no:cacheprovider privacy/tests
          uv run --with coverage==7.6.4 coverage run -m unittest discover -s ops/tests -p "test_*.py"
          uv run --with coverage==7.6.4 coverage combine
          uv run --with coverage==7.6.4 coverage report
          uv run --with coverage==7.6.4 coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
