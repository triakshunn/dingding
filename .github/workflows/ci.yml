name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format check (ruff, Black/Pyink style)
        run: uv run ruff format --check .

      # Google Python Style Guide rules (pyproject.toml), all enforced.
      - name: Lint (ruff)
        run: uv run ruff check .

      # Each suite runs under coverage; on failure the tail of its output is
      # posted as an annotation so it is visible without opening the logs.
      - name: Broker tests
        run: ./.github/run-suite.sh broker -m unittest discover -s broker/tests

      - name: Privacy tests
        run: ./.github/run-suite.sh privacy -m pytest -q -p no:cacheprovider privacy/tests

      - name: Ops tests
        run: ./.github/run-suite.sh ops -m unittest discover -s ops/tests -p "test_*.py"

      - name: Coverage report
        run: |
          uv run --with coverage==7.6.4 coverage combine
          uv run --with coverage==7.6.4 coverage report
          uv run --with coverage==7.6.4 coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
