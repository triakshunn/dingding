<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dingding demo</title>
<style>
/* Reenactment of a real dingding chat in Telegram, with made-up emails. Rendered frame by frame by record.mjs. */
:root {
  --chat-bg: #dfe6d8;      /* muted Telegram-like wallpaper tone, no pattern */
  --in: #ffffff;           /* bot bubble */
  --out: #e3f8cf;          /* user bubble */
  --ink: #1b1f1a;
  --muted: #6f7a6d;
  --accent: #3d8fd1;       /* links / "typing…" */
  --check: #4fae4e;
  --bar: #ffffff;
  --line: #d4dbcf;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 400px; height: 720px; overflow: hidden; background: var(--chat-bg); }
body { font: 14.5px/1.38 Roboto, "Noto Color Emoji", sans-serif; color: var(--ink); }

header { position: absolute; inset: 0 0 auto; height: 56px; background: var(--bar); display: flex; align-items: center;
         gap: 11px; padding: 0 14px; border-bottom: 1px solid var(--line); z-index: 2; }
.back { color: var(--accent); font-size: 26px; line-height: 1; margin-right: 2px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #e8a33d; color: #fff; display: grid;
          place-items: center; font-weight: 500; font-size: 17px; }
.who b { display: block; font-weight: 500; font-size: 15.5px; }
.who span { font-size: 12.5px; color: var(--muted); }
.who span.typing { color: var(--accent); }

#chat { position: absolute; top: 56px; bottom: 54px; left: 0; right: 0; overflow: hidden; }
#feed { display: flex; flex-direction: column; gap: 6px; padding: 12px 10px 10px; will-change: transform; }
.day { align-self: center; background: rgba(60, 80, 55, .28); color: #fff; font-size: 12.5px; padding: 2px 9px;
       border-radius: 10px; margin-bottom: 4px; }
.msg { max-width: 86%; padding: 6px 9px 5px; border-radius: 12px; white-space: pre-wrap; position: relative;
       box-shadow: 0 1px 0.5px rgba(0,0,0,.13); opacity: 0; transform: translateY(8px); }
.msg.bot { align-self: flex-start; background: var(--in); border-bottom-left-radius: 4px; }
.msg.me  { align-self: flex-end; background: var(--out); border-bottom-right-radius: 4px; }
.meta { float: right; margin: 6px 0 -3px 10px; font-size: 11.5px; color: var(--muted); }
.me .meta { color: #5d9a55; }
.me .meta::after { content: " ✓✓"; color: var(--check); letter-spacing: -2px; }
.ph { background: #eef1f6; border-radius: 4px; padding: 0 3px; font-size: 13px; }

footer { position: absolute; inset: auto 0 0; height: 54px; background: var(--bar); border-top: 1px solid var(--line);
         display: flex; align-items: center; gap: 10px; padding: 0 12px; }
#input { flex: 1; font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; }
#input.empty { color: #a3aaa1; }
#caret { display: inline-block; width: 1.5px; height: 18px; background: var(--accent); vertical-align: -3px; margin-left: 1px; }
.send { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.send svg { width: 17px; height: 17px; fill: #fff; margin-left: 2px; }
</style>
</head>
<body>
<header>
  <span class="back">‹</span>
  <div class="avatar">d</div>
  <div class="who"><b>dingding</b><span id="status">bot</span></div>
</header>
<div id="chat"><div id="feed"><div class="day">Today</div></div></div>
<footer>
  <div id="input" class="empty">Message</div>
  <div class="send"><svg viewBox="0 0 24 24"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg></div>
</footer>

<script>
// Timeline (seconds). Bot messages show "typing…" for `think` seconds first; user messages are typed in the input bar.
const BRIEF = `☀️ Mon Nov 9 · 18 new emails

🗓 TODAY
• 10:30 AM  ROB 550 lecture
• 3:00 PM  Lab meeting · GGB 2140

⚡ ACTION NEEDED
 1. Pay housing deposit ($250), due Wed Nov 11 · Housing Office
 2. Spring career fair registration closes Fri

✉️ REPLY TO
 3. Prof. Alvarez: can you meet Tue or Wed about the project?

🎉 EVENTS YOU MIGHT LIKE
 4. Robotics seminar: legged robots on ice · Thu 4 PM · FRB 2300

🔔 HEADS-UP
• REI package arrives today

🔒 PRIVATE (open in Gmail)
• Chase · Student Health

📰 Skipped: 11 promos, 3 newsletters

Reply: "add 1 4" · "reply 3 …" · "archive all of them"`;

const SCRIPT = [
  { who: "bot", at: 1.2, think: 1.0, time: "7:02", text: BRIEF },
  { who: "me",  at: 7.4, type: 1.0, time: "7:41", text: "add 1 4" },
  { who: "bot", at: 9.0, think: 1.1, time: "7:41",
    text: "Added to your calendar:\n• ⏰ Pay housing deposit · Wed Nov 11\n• Robotics seminar · Thu 4:00 PM · FRB 2300" },
  { who: "me",  at: 12.6, type: 1.9, time: "7:42", text: "reply 3 say tuesday 2pm works" },
  { who: "bot", at: 14.6, think: 1.3, time: "7:42",
    text: "Draft is in Gmail, tap Send there when you're happy with it:\n\n“Hi Prof. Alvarez, Tuesday at 2 PM works for me. See you then.\n\nThanks!”" },
  { who: "me",  at: 18.3, type: 1.3, time: "7:43", text: "archive all of them" },
  { who: "bot", at: 20.0, think: 1.0, time: "7:43",
    text: "That's 18 emails from this morning's brief. They leave the Inbox but stay in All Mail.\nArchive them?" },
  { who: "me",  at: 22.4, type: 0.5, time: "7:43", text: "yes" },
  { who: "bot", at: 23.8, think: 0.9, time: "7:43", text: "Done, 18 archived. Say \"undo\" to bring them back." },
];
const END = 27.5;

const feed = document.getElementById("feed"), chat = document.getElementById("chat");
const input = document.getElementById("input"), status = document.getElementById("status");
const els = SCRIPT.map(m => {
  const d = document.createElement("div");
  d.className = "msg " + m.who;
  d.textContent = m.text;
  const meta = document.createElement("span");
  meta.className = "meta"; meta.textContent = m.time;
  d.appendChild(meta);
  d.style.display = "none";
  feed.appendChild(d);
  return d;
});

let scroll = 0;   // eased between frames (frames are rendered in order)
window.END = END;
window.render = (t) => {
  let typing = "", botTyping = false;
  SCRIPT.forEach((m, i) => {
    const el = els[i], since = t - m.at;
    if (since >= 0) {
      el.style.display = "";
      const k = Math.min(1, since / 0.22), e = 1 - Math.pow(1 - k, 3);
      el.style.opacity = e; el.style.transform = `translateY(${(1 - e) * 8}px)`;
    } else el.style.display = "none";
    if (m.who === "me" && t >= m.at - m.type - 0.15 && t < m.at) {
      const k = Math.max(0, Math.min(1, (t - (m.at - m.type - 0.15)) / m.type));
      typing = m.text.slice(0, Math.round(k * m.text.length));
      if (k === 1) typing = m.text;
    }
    if (m.who === "bot" && t >= m.at - m.think && t < m.at) botTyping = true;
  });
  if (typing) { input.className = ""; input.innerHTML = ""; input.textContent = typing;
                const c = document.createElement("span"); c.id = "caret"; input.appendChild(c); }
  else { input.className = "empty"; input.textContent = "Message"; }
  status.textContent = botTyping ? "typing…" : "bot";
  status.className = botTyping ? "typing" : "";
  const target = Math.max(0, feed.scrollHeight - chat.clientHeight);
  scroll += (target - scroll) * 0.28;
  if (Math.abs(target - scroll) < 0.5) scroll = target;
  feed.style.transform = `translateY(${-scroll}px)`;
};
window.render(0);
</script>
</body>
</html>
